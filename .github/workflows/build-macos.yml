name: Build macOS (best effort)

# Separate from build-and-release.yml on purpose. Metered macOS runners can queue
# indefinitely on a fresh account; keeping them out of the main matrix means an
# unavailable runner only delays the macOS asset, never the whole release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-latest, goos: darwin, goarch: arm64, cc: clang}
          - {runner: macos-13, goos: darwin, goarch: amd64, cc: clang}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 -c 'import json, os; assert os.environ["GITHUB_REF_NAME"] == "v" + json.load(open("manifest.json"))["version"]'
      - name: Test, build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: bash build.sh
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/artifacts/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: perplexity-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/artifacts/*.zip
          if-no-files-found: error
