name: Build macOS (best effort)

# Separate from build-and-release.yml on purpose. Metered macOS runners can queue
# indefinitely on a fresh account; keeping them out of the main matrix means an
# unavailable runner only delays the macOS asset, never the whole release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-latest, goos: darwin, goarch: arm64, cc: clang}
          - {runner: macos-13, goos: darwin, goarch: amd64, cc: clang}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 -c 'import json, os; assert os.environ["GITHUB_REF_NAME"] == "v" + json.load(open("manifest.json"))["version"]'
      - name: Test, build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: perplexity-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/artifacts/*.zip
          if-no-files-found: error

  # Attach in one place after every macOS build finished, and rebuild checksums.txt
  # from the union of what the release already has plus the new Darwin zips. The
  # main workflow cannot include them: it runs before these builds finish, so its
  # checksums.txt would never cover Darwin, and the store verifies that file.
  attach:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: darwin-assets
          merge-multiple: true
      - name: Collect the release's current assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.zip' --dir release-assets --clobber
          cp darwin-assets/*.zip release-assets/
      - name: Rebuild checksums.txt over every platform
        working-directory: release-assets
        run: |
          set -euo pipefail
          for f in ./*.zip; do sha256sum "$f" | sed "s|  \./|  |"; done > checksums.txt
          cat checksums.txt
      - name: Upload the Darwin zips and the refreshed checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            darwin-assets/*.zip release-assets/checksums.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
