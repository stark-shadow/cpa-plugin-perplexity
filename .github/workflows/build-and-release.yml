name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, goos: linux, goarch: amd64, cc: gcc}
          - {runner: ubuntu-latest, goos: linux, goarch: arm64, cc: aarch64-linux-gnu-gcc}
          - {runner: ubuntu-latest, goos: windows, goarch: amd64, cc: x86_64-w64-mingw32-gcc}
          # macOS minutes are metered and the hosted runners can sit queued for a
          # long time on a fresh account. Marked optional so an unavailable macOS
          # runner never blocks a release for the platforms people actually use.
          - {runner: macos-latest, goos: darwin, goarch: arm64, cc: clang, optional: true}
          - {runner: macos-latest, goos: darwin, goarch: amd64, cc: clang, optional: true}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install cross compiler
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Install MinGW for Windows
        if: matrix.goos == 'windows'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 -c 'import json, os; assert os.environ["GITHUB_REF_NAME"] == "v" + json.load(open("manifest.json"))["version"]'
      - name: Test, build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: perplexity-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/artifacts/*.zip
          if-no-files-found: error

  release:
    needs: build
    # Publish whatever succeeded: a missing optional platform must not block the rest.
    if: always() && startsWith(github.ref, 'refs/tags/v') && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: List collected assets
        run: ls -l release-assets
      - name: Checksums
        working-directory: release-assets
        run: for f in ./*.zip; do sha256sum "$f" | sed "s|  \./|  |"; done > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
